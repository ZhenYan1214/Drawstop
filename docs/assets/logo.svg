<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Drawstop logo: a drawdown arrow stopped at a barrier, with funds held below">
  <rect width="160" height="160" rx="14" fill="#0d1117"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- drawdown, stopped short of the gate -->
    <path d="M80 26 V74" stroke="#c9d1d9" stroke-width="5"/>
    <path d="M65 60 L80 75 L95 60" stroke="#c9d1d9" stroke-width="5"/>
    <!-- the drawstop -->
    <path d="M36 92 H124" stroke="#e3b341" stroke-width="9"/>
    <!-- suspense: funds held, not passed on -->
    <rect x="54" y="108" width="52" height="26" rx="6" stroke="#8b949e" stroke-width="3" stroke-dasharray="5 5"/>
  </g>
</svg>
