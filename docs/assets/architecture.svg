<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575" role="img" aria-label="Drawstop architecture: cron and drawdown-request triggers start a Chainlink CRE workflow that queries The Gazette, Companies House and GLEIF with per-source consensus, then writes a signed report through the Keystone forwarder to StatusRegistry, which LoanFacility reads to decide drawdowns, suspense and reviews">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h { font-size: 14px; font-weight: 700; }
      .s { font-size: 12px; fill: #424a53; }
      .m { font-size: 12px; font-family: Consolas, "SFMono-Regular", Menlo, monospace; fill: #424a53; }
      .cap { font-size: 11px; font-weight: 700; fill: #59636e; letter-spacing: 1px; }
      .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
      .src { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
      .key { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
      .edge { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="960" height="575" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- column captions -->
  <text x="30" y="36" class="cap">TRIGGERS</text>
  <text x="250" y="36" class="cap">CHAINLINK CRE WORKFLOW (DON)</text>
  <text x="700" y="36" class="cap">ETHEREUM (SEPOLIA)</text>

  <!-- triggers -->
  <rect x="30" y="80" width="180" height="62" rx="8" class="box"/>
  <text x="44" y="105" class="h">Cron · H2</text>
  <text x="44" y="126" class="s">every monitored company</text>

  <rect x="30" y="250" width="180" height="78" rx="8" class="box"/>
  <text x="44" y="275" class="h">Drawdown request · H3</text>
  <text x="44" y="296" class="s">EVM log trigger on</text>
  <text x="44" y="314" class="m">DrawdownRequested</text>

  <!-- CRE workflow -->
  <rect x="250" y="50" width="400" height="368" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>

  <rect x="270" y="70" width="360" height="86" rx="8" class="src"/>
  <text x="286" y="94" class="h">The Gazette · primary</text>
  <text x="286" y="114" class="s">corporate-insolvency search → confirm each notice's</text>
  <text x="286" y="132" class="s">linked data: company number, petition date, court case</text>
  <text x="286" y="148" class="m">2450 petition · 2461 dismissal · 2452 order …</text>

  <rect x="270" y="168" width="360" height="62" rx="8" class="src"/>
  <text x="286" y="192" class="h">Companies House</text>
  <text x="286" y="212" class="s">company_status, insolvency history (lags the Gazette)</text>

  <rect x="270" y="242" width="360" height="62" rx="8" class="src"/>
  <text x="286" y="266" class="h">GLEIF · cross-check only</text>
  <text x="286" y="286" class="s">LEI ↔ company number; never pauses on its own</text>

  <rect x="270" y="320" width="360" height="82" rx="8" class="key"/>
  <text x="286" y="344" class="h">Identical-value consensus, per source</text>
  <text x="286" y="364" class="s">normalized enums, dates and hashes only</text>
  <text x="286" y="382" class="s">failure or disagreement → "could not be checked",</text>
  <text x="286" y="398" class="s">never "clean"</text>

  <!-- triggers to workflow -->
  <path d="M210 111 H250" class="edge" marker-end="url(#arrow)"/>
  <path d="M210 289 H250" class="edge" marker-end="url(#arrow)"/>

  <!-- chain side -->
  <rect x="700" y="62" width="230" height="56" rx="8" class="box"/>
  <text x="716" y="86" class="h">KeystoneForwarder</text>
  <text x="716" y="105" class="s">verifies DON signatures</text>

  <rect x="700" y="150" width="230" height="118" rx="8" class="box"/>
  <text x="716" y="174" class="h">StatusRegistry</text>
  <text x="716" y="195" class="s">found / not found / could not be</text>
  <text x="716" y="212" class="s">checked, as of time T, with expiry</text>
  <text x="716" y="232" class="s">absence ≠ resolution</text>
  <text x="716" y="252" class="s">firstSeen per event</text>

  <rect x="700" y="300" width="230" height="176" rx="8" class="key"/>
  <text x="716" y="324" class="h">LoanFacility</text>
  <text x="716" y="346" class="s">drawstop (cf. LMA cl. 4.2)</text>
  <text x="716" y="366" class="s">petition carve-out (cf. cl. 23.7)</text>
  <text x="716" y="386" class="s">s.127 suspense for repayments</text>
  <text x="716" y="406" class="s">append-only, expiring reviews</text>
  <text x="716" y="426" class="s">default only by the lender</text>
  <text x="716" y="452" class="m">status()</text>

  <!-- workflow to chain -->
  <path d="M650 111 H700" class="edge" marker-end="url(#arrow)"/>
  <text x="653" y="104" class="s">report</text>
  <path d="M815 118 V150" class="edge" marker-end="url(#arrow)"/>
  <path d="M815 268 V300" class="edge" marker-end="url(#arrow)"/>
  <text x="823" y="289" class="s">getLatest()</text>

  <!-- H3 is emitted by the facility -->
  <path d="M700 448 H120 V328" class="edge dash" marker-end="url(#arrow)"/>
  <text x="300" y="440" class="s">requestDrawdown() emits the event that starts a fresh check</text>

  <!-- actors -->
  <path d="M310 490 V470 M460 490 V470 M610 490 V470 M310 470 H700" class="edge"/>
  <path d="M640 470 H700" class="edge" marker-end="url(#arrow)"/>
  <rect x="250" y="490" width="120" height="44" rx="22" class="box"/>
  <text x="310" y="517" text-anchor="middle" class="h">Borrower</text>
  <text x="310" y="556" text-anchor="middle" class="s">request · repay</text>
  <rect x="400" y="490" width="120" height="44" rx="22" class="box"/>
  <text x="460" y="517" text-anchor="middle" class="h">Lender</text>
  <text x="460" y="556" text-anchor="middle" class="s">bind · declare default</text>
  <rect x="550" y="490" width="120" height="44" rx="22" class="box"/>
  <text x="610" y="517" text-anchor="middle" class="h">Arbiter</text>
  <text x="610" y="556" text-anchor="middle" class="s">review · resolve suspense</text>
</svg>
