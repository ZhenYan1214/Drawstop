<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="Why it is buildable: built today versus path to production" font-family="Newsreader, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif">
<rect width="960" height="450" fill="#f2ede2"/><line x1="40" y1="16" x2="920" y2="16" stroke="#1a1814" stroke-width="3"/><line x1="40" y1="21" x2="920" y2="21" stroke="#1a1814" stroke-width="1"/><text x="40" y="58" font-size="22" font-weight="600" fill="#1a1814">Why it is buildable</text><text x="40" y="82" font-size="14" font-weight="400" fill="#48433b">Nothing here needs a consortium, a paid data feed or a new law</text><rect x="40" y="100" width="430" height="320" fill="#e9e2d3"/><rect x="40" y="100" width="430" height="3" fill="#48433b"/><text x="60" y="130" font-size="15" font-weight="700" fill="#48433b">BUILT AND RUNNING TODAY</text><text x="60" y="166" font-size="15" font-weight="700" fill="#48433b">✓</text><text x="82" y="166" font-size="13.5" font-weight="400" fill="#1a1814">Free, licensed public data: Gazette (OGL), Companies</text><text x="82" y="184" font-size="13.5" font-weight="400" fill="#1a1814">House API, GLEIF (CC0)</text><text x="60" y="218" font-size="15" font-weight="700" fill="#48433b">✓</text><text x="82" y="218" font-size="13.5" font-weight="400" fill="#1a1814">Workflow runs in the CRE CLI against live sources</text><text x="82" y="236" font-size="13.5" font-weight="400" fill="#1a1814">today</text><text x="60" y="270" font-size="15" font-weight="700" fill="#48433b">✓</text><text x="82" y="270" font-size="13.5" font-weight="400" fill="#1a1814">Contracts deployed and source-verified on Sepolia</text><text x="60" y="304" font-size="15" font-weight="700" fill="#48433b">✓</text><text x="82" y="304" font-size="13.5" font-weight="400" fill="#1a1814">Every result reproduces with one command: forge</text><text x="82" y="322" font-size="13.5" font-weight="400" fill="#1a1814">test, bun test, cre simulate</text><text x="60" y="356" font-size="15" font-weight="700" fill="#48433b">✓</text><text x="82" y="356" font-size="13.5" font-weight="400" fill="#1a1814">Agreement rider maps each clause to code</text><text x="82" y="374" font-size="13.5" font-weight="400" fill="#1a1814">(docs/agreement-rider.md)</text><rect x="490" y="100" width="430" height="320" fill="#e9e2d3"/><rect x="490" y="100" width="430" height="3" fill="#a3271d"/><text x="510" y="130" font-size="15" font-weight="700" fill="#a3271d">PATH TO PRODUCTION</text><text x="510" y="166" font-size="15" font-weight="700" fill="#a3271d">→</text><text x="532" y="166" font-size="13.5" font-weight="400" fill="#1a1814">CRE deploy access (requested), so a DON runs it on a</text><text x="532" y="184" font-size="13.5" font-weight="400" fill="#1a1814">schedule</text><text x="510" y="218" font-size="15" font-weight="700" fill="#a3271d">→</text><text x="532" y="218" font-size="13.5" font-weight="400" fill="#1a1814">Switch registry to the production KeystoneForwarder;</text><text x="532" y="236" font-size="13.5" font-weight="400" fill="#1a1814">pin workflow ID</text><text x="510" y="270" font-size="15" font-weight="700" fill="#a3271d">→</text><text x="532" y="270" font-size="13.5" font-weight="400" fill="#1a1814">Registry owner becomes a multisig with a timelock,</text><text x="532" y="288" font-size="13.5" font-weight="400" fill="#1a1814">or is renounced</text><text x="510" y="322" font-size="15" font-weight="700" fill="#a3271d">→</text><text x="532" y="322" font-size="13.5" font-weight="400" fill="#1a1814">Optional court-filing source: 99% of E&amp;W petitions</text><text x="532" y="340" font-size="13.5" font-weight="400" fill="#1a1814">are in CE-File courts</text><text x="510" y="374" font-size="15" font-weight="700" fill="#a3271d">→</text><text x="532" y="374" font-size="13.5" font-weight="400" fill="#1a1814">Pilot with a facility agent or pool delegate on one</text><text x="532" y="392" font-size="13.5" font-weight="400" fill="#1a1814">real facility</text>
</svg>
