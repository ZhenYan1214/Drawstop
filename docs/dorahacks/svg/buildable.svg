<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Why it is buildable: built today versus path to production" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="958" height="398" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="40" y="50" font-size="22" font-weight="600" fill="#1f2328">Why it is buildable</text><text x="40" y="76" font-size="14" font-weight="400" fill="#57606a">Nothing here needs a consortium, a paid data feed or a new law</text><rect x="40" y="100" width="430" height="270" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="60" y="130" font-size="15" font-weight="700" fill="#1a7f37">BUILT AND RUNNING TODAY</text><text x="60" y="166" font-size="15" font-weight="700" fill="#1a7f37">✓</text><text x="82" y="166" font-size="13.5" font-weight="400" fill="#1f2328">Free, licensed public data: Gazette (OGL), Companies</text><text x="82" y="183" font-size="13.5" font-weight="400" fill="#1f2328">House API, GLEIF (CC0)</text><text x="60" y="208" font-size="15" font-weight="700" fill="#1a7f37">✓</text><text x="82" y="208" font-size="13.5" font-weight="400" fill="#1f2328">Workflow runs in the CRE CLI against live sources</text><text x="82" y="225" font-size="13.5" font-weight="400" fill="#1f2328">today</text><text x="60" y="250" font-size="15" font-weight="700" fill="#1a7f37">✓</text><text x="82" y="250" font-size="13.5" font-weight="400" fill="#1f2328">Contracts deployed and source-verified on Sepolia</text><text x="60" y="292" font-size="15" font-weight="700" fill="#1a7f37">✓</text><text x="82" y="292" font-size="13.5" font-weight="400" fill="#1f2328">Fits Sepolia’s per-transaction gas cap (measured,</text><text x="82" y="309" font-size="13.5" font-weight="400" fill="#1f2328">1.6% headroom)</text><text x="60" y="334" font-size="15" font-weight="700" fill="#1a7f37">✓</text><text x="82" y="334" font-size="13.5" font-weight="400" fill="#1f2328">Agreement rider maps each clause to code</text><text x="82" y="351" font-size="13.5" font-weight="400" fill="#1f2328">(docs/agreement-rider.md)</text><rect x="490" y="100" width="430" height="270" rx="10" fill="#ddf4ff" stroke="#2a78d6" stroke-width="1.5"/><text x="510" y="130" font-size="15" font-weight="700" fill="#2a78d6">PATH TO PRODUCTION</text><text x="510" y="166" font-size="15" font-weight="700" fill="#2a78d6">→</text><text x="532" y="166" font-size="13.5" font-weight="400" fill="#1f2328">CRE deploy access (requested) → DON runs it on a</text><text x="532" y="183" font-size="13.5" font-weight="400" fill="#1f2328">schedule</text><text x="510" y="208" font-size="15" font-weight="700" fill="#2a78d6">→</text><text x="532" y="208" font-size="13.5" font-weight="400" fill="#1f2328">Switch registry to the production KeystoneForwarder;</text><text x="532" y="225" font-size="13.5" font-weight="400" fill="#1f2328">pin workflow ID</text><text x="510" y="250" font-size="15" font-weight="700" fill="#2a78d6">→</text><text x="532" y="250" font-size="13.5" font-weight="400" fill="#1f2328">Registry owner → multisig + timelock, or renounced</text><text x="510" y="292" font-size="15" font-weight="700" fill="#2a78d6">→</text><text x="532" y="292" font-size="13.5" font-weight="400" fill="#1f2328">Optional court-filing source: 99% of E&amp;W petitions</text><text x="532" y="309" font-size="13.5" font-weight="400" fill="#1f2328">are in CE-File courts</text><text x="510" y="334" font-size="15" font-weight="700" fill="#2a78d6">→</text><text x="532" y="334" font-size="13.5" font-weight="400" fill="#1f2328">Pilot with a facility agent or pool delegate on one</text><text x="532" y="351" font-size="13.5" font-weight="400" fill="#1f2328">real facility</text>
</svg>
