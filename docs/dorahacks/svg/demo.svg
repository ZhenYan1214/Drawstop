<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="692" viewBox="0 0 1000 692" role="img" aria-label="Loan contract on Sepolia: drawdown, petition drawstop, suspense, dismissal; then a winding-up order, flagged repayment, suspense returned to the Official Receiver" font-family="Newsreader, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif">
<rect width="1000" height="692" fill="#f2ede2"/><line x1="40" y1="16" x2="960" y2="16" stroke="#1a1814" stroke-width="3"/><line x1="40" y1="21" x2="960" y2="21" stroke="#1a1814" stroke-width="1"/><text x="40" y="58" font-size="22" font-weight="600" fill="#1a1814">What the loan contract did on Sepolia</text><text x="40" y="82" font-size="14" font-weight="400" fill="#48433b">Fictional borrower DM000001 via a local Gazette mirror · compressed time · 30-day carve-out · every check a CRE run</text><text x="40" y="112" font-size="13" font-weight="700" fill="#48433b">ACT 1 · A PETITION</text><rect x="40" y="126" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="154" font-size="13" font-weight="600" fill="#48433b">1–2</text><text x="110" y="154" font-size="14" font-weight="400" fill="#1a1814">Clean record; borrower requests 10,000, then a fresh CRE check</text><rect x="590" y="136" width="79.6" height="24" rx="2" fill="#e9e2d3" stroke="#48433b" stroke-width="1.2"/><text x="600" y="153" font-size="12" font-weight="600" fill="#48433b" font-family="Consolas, monospace">✓ NORMAL</text><text x="770" y="154" font-size="14" font-weight="600" fill="#1a1814">10,000 drawn</text><rect x="40" y="178" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="206" font-size="13" font-weight="600" fill="#48433b">3–4</text><text x="110" y="206" font-size="14" font-weight="400" fill="#1a1814">Petition advertised; the next request gets a fresh check</text><rect x="590" y="188" width="165.6" height="24" rx="2" fill="#efe4c9" stroke="#8f6414" stroke-width="1.2"/><text x="600" y="205" font-size="12" font-weight="600" fill="#8f6414" font-family="Consolas, monospace">! PETITION_PENDING</text><text x="770" y="206" font-size="14" font-weight="600" fill="#a3271d">drawdown reverts</text><rect x="40" y="230" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="258" font-size="13" font-weight="600" fill="#48433b">5</text><text x="110" y="258" font-size="14" font-weight="400" fill="#1a1814">Borrower repays 5,000 while the petition is live</text><rect x="590" y="240" width="165.6" height="24" rx="2" fill="#efe4c9" stroke="#8f6414" stroke-width="1.2"/><text x="600" y="257" font-size="12" font-weight="600" fill="#8f6414" font-family="Consolas, monospace">! PETITION_PENDING</text><text x="770" y="258" font-size="14" font-weight="600" fill="#1a1814">5,000 held in suspense</text><rect x="40" y="282" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="310" font-size="13" font-weight="600" fill="#48433b">6</text><text x="110" y="310" font-size="14" font-weight="400" fill="#1a1814">Dismissal for the same court case</text><rect x="590" y="292" width="79.6" height="24" rx="2" fill="#e9e2d3" stroke="#48433b" stroke-width="1.2"/><text x="600" y="309" font-size="12" font-weight="600" fill="#48433b" font-family="Consolas, monospace">✓ NORMAL</text><text x="770" y="310" font-size="14" font-weight="600" fill="#1a1814">suspense → lender</text><text x="40" y="348" font-size="13" font-weight="700" fill="#48433b">ACT 2 · A WINDING-UP ORDER</text><rect x="40" y="362" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="390" font-size="13" font-weight="600" fill="#48433b">7</text><text x="110" y="390" font-size="14" font-weight="400" fill="#1a1814">Borrower repays 3,000; the record still looks clean</text><rect x="590" y="372" width="79.6" height="24" rx="2" fill="#e9e2d3" stroke="#48433b" stroke-width="1.2"/><text x="600" y="389" font-size="12" font-weight="600" fill="#48433b" font-family="Consolas, monospace">✓ NORMAL</text><text x="770" y="390" font-size="14" font-weight="600" fill="#1a1814">3,000 → lender</text><rect x="40" y="414" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="442" font-size="13" font-weight="600" fill="#48433b">8</text><text x="110" y="442" font-size="14" font-weight="400" fill="#1a1814">Winding-up order; its petition was presented 12 days earlier</text><rect x="590" y="424" width="157" height="24" rx="2" fill="#f1dcd5" stroke="#a3271d" stroke-width="1.2"/><text x="600" y="441" font-size="12" font-weight="600" fill="#a3271d" font-family="Consolas, monospace">■ REVIEW_REQUIRED</text><text x="770" y="442" font-size="14" font-weight="600" fill="#a3271d">3,000 flagged, not stopped</text><rect x="40" y="466" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="494" font-size="13" font-weight="600" fill="#48433b">9</text><text x="110" y="494" font-size="14" font-weight="400" fill="#1a1814">Borrower repays 2,000 after the order</text><rect x="590" y="476" width="157" height="24" rx="2" fill="#f1dcd5" stroke="#a3271d" stroke-width="1.2"/><text x="600" y="493" font-size="12" font-weight="600" fill="#a3271d" font-family="Consolas, monospace">■ REVIEW_REQUIRED</text><text x="770" y="494" font-size="14" font-weight="600" fill="#1a1814">2,000 held in suspense</text><rect x="40" y="518" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="546" font-size="13" font-weight="600" fill="#48433b">10</text><text x="110" y="546" font-size="14" font-weight="400" fill="#1a1814">Arbiter (neutral reviewer) names the Official Receiver; early transfer reverts</text><rect x="590" y="528" width="157" height="24" rx="2" fill="#f1dcd5" stroke="#a3271d" stroke-width="1.2"/><text x="600" y="545" font-size="12" font-weight="600" fill="#a3271d" font-family="Consolas, monospace">■ REVIEW_REQUIRED</text><text x="770" y="546" font-size="14" font-weight="600" fill="#1a1814">effective after 2 days</text><rect x="40" y="570" width="920" height="44" rx="1.5" fill="#f2ede2" stroke="#cfc5b1" stroke-width="1.5"/><text x="52" y="598" font-size="13" font-weight="600" fill="#48433b">11</text><text x="110" y="598" font-size="14" font-weight="400" fill="#1a1814">After the delay, suspense goes back to the estate (22 Oct)</text><rect x="590" y="580" width="157" height="24" rx="2" fill="#f1dcd5" stroke="#a3271d" stroke-width="1.2"/><text x="600" y="597" font-size="12" font-weight="600" fill="#a3271d" font-family="Consolas, monospace">■ REVIEW_REQUIRED</text><text x="770" y="598" font-size="14" font-weight="600" fill="#1a1814">2,000 → Official Receiver</text><rect x="40" y="628" width="920" height="56" fill="#e9e2d3"/><rect x="40" y="628" width="4" height="56" fill="#a3271d"/><text x="56" y="651" font-size="14" font-weight="600" fill="#1a1814">s.127 statement rebuilt from on-chain events: at least 8,000 reached the lender after presentation, not 3,000.</text><text x="56" y="671" font-size="13" font-weight="400" fill="#48433b">The 5,000 released after act 1's dismissal came after act 2's petition. Facts for a court; whether it is void is the court's call.</text>
</svg>
