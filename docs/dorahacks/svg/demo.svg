<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="692" viewBox="0 0 1000 692" role="img" aria-label="Loan contract on Sepolia: drawdown, petition drawstop, suspense, dismissal; then a winding-up order, flagged repayment, suspense returned to the Official Receiver" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="998" height="690" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="40" y="50" font-size="22" font-weight="600" fill="#1f2328">What the loan contract did on Sepolia</text><text x="40" y="76" font-size="14" font-weight="400" fill="#57606a">Fictional borrower DM000001 · 30-day carve-out from presentation · every check is a Chainlink CRE workflow run</text><text x="40" y="112" font-size="13" font-weight="700" fill="#57606a">ACT 1 · A PETITION</text><rect x="40" y="126" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="154" font-size="13" font-weight="600" fill="#57606a">1–2</text><text x="110" y="154" font-size="14" font-weight="400" fill="#1f2328">Clean record · borrower requests 10,000 → fresh CRE check</text><rect x="590" y="136" width="79.6" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="600" y="153" font-size="12" font-weight="600" fill="#1a7f37" font-family="Consolas, monospace">✓ NORMAL</text><text x="770" y="154" font-size="14" font-weight="600" fill="#1f2328">10,000 drawn</text><rect x="40" y="178" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="206" font-size="13" font-weight="600" fill="#57606a">3–4</text><text x="110" y="206" font-size="14" font-weight="400" fill="#1f2328">Petition advertised · next request → fresh check</text><rect x="590" y="188" width="165.6" height="24" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/><text x="600" y="205" font-size="12" font-weight="600" fill="#9a6700" font-family="Consolas, monospace">! PETITION_PENDING</text><text x="770" y="206" font-size="14" font-weight="600" fill="#cf222e">drawdown reverts</text><rect x="40" y="230" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="258" font-size="13" font-weight="600" fill="#57606a">5</text><text x="110" y="258" font-size="14" font-weight="400" fill="#1f2328">Borrower repays 5,000 while the petition is live</text><rect x="590" y="240" width="165.6" height="24" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/><text x="600" y="257" font-size="12" font-weight="600" fill="#9a6700" font-family="Consolas, monospace">! PETITION_PENDING</text><text x="770" y="258" font-size="14" font-weight="600" fill="#1f2328">5,000 held in suspense</text><rect x="40" y="282" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="310" font-size="13" font-weight="600" fill="#57606a">6</text><text x="110" y="310" font-size="14" font-weight="400" fill="#1f2328">Dismissal for the same court case</text><rect x="590" y="292" width="79.6" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="600" y="309" font-size="12" font-weight="600" fill="#1a7f37" font-family="Consolas, monospace">✓ NORMAL</text><text x="770" y="310" font-size="14" font-weight="600" fill="#1f2328">suspense → lender</text><text x="40" y="348" font-size="13" font-weight="700" fill="#57606a">ACT 2 · A WINDING-UP ORDER</text><rect x="40" y="362" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="390" font-size="13" font-weight="600" fill="#57606a">7</text><text x="110" y="390" font-size="14" font-weight="400" fill="#1f2328">Borrower repays 3,000; the record still looks clean</text><rect x="590" y="372" width="79.6" height="24" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="600" y="389" font-size="12" font-weight="600" fill="#1a7f37" font-family="Consolas, monospace">✓ NORMAL</text><text x="770" y="390" font-size="14" font-weight="600" fill="#1f2328">3,000 → lender</text><rect x="40" y="414" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="442" font-size="13" font-weight="600" fill="#57606a">8</text><text x="110" y="442" font-size="14" font-weight="400" fill="#1f2328">Winding-up order; its petition was presented 12 days earlier</text><rect x="590" y="424" width="157" height="24" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="600" y="441" font-size="12" font-weight="600" fill="#cf222e" font-family="Consolas, monospace">■ REVIEW_REQUIRED</text><text x="770" y="442" font-size="14" font-weight="600" fill="#cf222e">3,000 flagged, not stopped</text><rect x="40" y="466" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="494" font-size="13" font-weight="600" fill="#57606a">9</text><text x="110" y="494" font-size="14" font-weight="400" fill="#1f2328">Borrower repays 2,000 after the order</text><rect x="590" y="476" width="157" height="24" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="600" y="493" font-size="12" font-weight="600" fill="#cf222e" font-family="Consolas, monospace">■ REVIEW_REQUIRED</text><text x="770" y="494" font-size="14" font-weight="600" fill="#1f2328">2,000 held in suspense</text><rect x="40" y="518" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="546" font-size="13" font-weight="600" fill="#57606a">10</text><text x="110" y="546" font-size="14" font-weight="400" fill="#1f2328">Arbiter nominates the Official Receiver; an early transfer reverts</text><rect x="590" y="528" width="157" height="24" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="600" y="545" font-size="12" font-weight="600" fill="#cf222e" font-family="Consolas, monospace">■ REVIEW_REQUIRED</text><text x="770" y="546" font-size="14" font-weight="600" fill="#1f2328">effective after 2 days</text><rect x="40" y="570" width="920" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="52" y="598" font-size="13" font-weight="600" fill="#57606a">11</text><text x="110" y="598" font-size="14" font-weight="400" fill="#1f2328">After the delay, suspense goes back to the estate (scheduled 19 Oct)</text><rect x="590" y="580" width="157" height="24" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="600" y="597" font-size="12" font-weight="600" fill="#cf222e" font-family="Consolas, monospace">■ REVIEW_REQUIRED</text><text x="770" y="598" font-size="14" font-weight="600" fill="#1f2328">2,000 → Official Receiver</text><rect x="40" y="628" width="920" height="56" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="56" y="651" font-size="14" font-weight="600" fill="#1f2328">s.127 statement rebuilt from on-chain events: 8,000 reached the lender after presentation, not 3,000.</text><text x="56" y="671" font-size="13" font-weight="400" fill="#57606a">The 5,000 released after act 1's dismissal landed after act 2's petition was presented. A dismissal clears only its own petition.</text>
</svg>
