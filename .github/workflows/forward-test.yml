# Daily forward test: Drawstop's Gazette check beside a Companies House-only watcher, on petitions as they are
# advertised. The commit and this job's log timestamp every observation publicly.
# Needs the repository secret CH_API_KEY (Companies House REST key, Live).
name: forward-test

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily (the Gazette publishes through the day; this sees the previous days)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-test
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Collect today's observations
        env:
          CH_API_KEY_VAR: ${{ secrets.CH_API_KEY }}
        run: bun research/forward/daily.ts
      - name: Commit observations
        run: |
          git config user.name "drawstop-forward-test"
          git config user.email "drawstop-forward-test@users.noreply.github.com"
          git add research/forward/data
          if git diff --cached --quiet; then echo "no new observations"; exit 0; fi
          git commit -m "Forward test: observations for $(date -u +%F)"
          git push
