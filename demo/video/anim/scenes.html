<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawstop video scenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<style>
  /* Animated scenes for the demo video. Every frame is a pure function of time: render-anim.js calls
     setup(scene, duration, cues, data) once, then seek(t) for each frame, so animation lands on spoken words. */
  :root { --paper:#f2ede2; --paper-2:#e9e2d3; --paper-3:#ddd4c1; --ink:#1a1814; --ink-2:#48433b; --ink-3:#827a6c; --seal:#a3271d; --seal-wash:rgba(163,39,29,.10); --ochre:#8f6414; --ochre-wash:rgba(143,100,20,.13); --green:#2f6b2b;
    --serif:"Newsreader", Georgia, serif; --mono:"IBM Plex Mono", Consolas, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--serif); }
  #stage { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .k { font-family: var(--mono); font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: var(--seal); }
  .rule { position: absolute; left: 160px; right: 160px; top: 92px; border-top: 3px solid var(--ink); }
  .rule::after { content: ""; position: absolute; left: 0; right: 0; top: 5px; border-top: 1px solid var(--ink); }
  .big { font-weight: 400; letter-spacing: -.02em; line-height: .9; font-feature-settings: 'lnum','tnum'; }
  .cap { font-size: 34px; line-height: 1.25; color: var(--ink-2); }
  .mono { font-family: var(--mono); }
  .stamp { display: inline-block; font-family: var(--mono); font-size: 22px; letter-spacing: .14em; text-transform: uppercase; border: 3px solid currentColor; padding: 6px 14px; border-radius: 4px; }
  svg text { font-family: var(--serif); }
  .card { position: absolute; background: #f8f4ea; border: 2px solid var(--ink); border-radius: 10px; padding: 22px 26px; }
  .card h3 { font-size: 34px; font-weight: 500; margin-bottom: 6px; }
  .card p { font-size: 24px; color: var(--ink-2); line-height: 1.3; }
  .shot { position: absolute; background: #fff; border: 1px solid var(--paper-3); box-shadow: 0 18px 50px rgba(26,24,20,.18); border-radius: 6px; overflow: hidden; }
  .shot img { display: block; width: 100%; }
  .credit { position: absolute; font-family: var(--mono); font-size: 18px; color: var(--ink-3); letter-spacing: .04em; }
  .card .t { font-family: var(--mono); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ── helpers ───────────────────────────────────────────────────────────────
const $ = (s) => document.querySelector(s)
const clamp = (x) => Math.max(0, Math.min(1, x))
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const out = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3) }
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2) }
const p = (t, t0, d = .6) => clamp((t - t0) / d)                     // progress 0..1
const show = (el, k, dy = 24) => { el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)` }
const pop = (el, k) => { el.style.opacity = clamp(k * 3); el.style.transform = `scale(${.6 + .4 * back(k)})` }
const fmt = (n) => Math.round(n).toLocaleString('en-GB')
const h = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const add = (html) => $('#stage').appendChild(h(html))
let S = {}, C = {}, D = 0, DATA = {}
const cue = (name, fallback) => (C[name] ?? fallback)

// ── icons (line art, 100x100) ─────────────────────────────────────────────
const I = {
  gavel: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="38" y="14" width="40" height="20" rx="4" transform="rotate(35 58 24)"/><path d="M46 38 L18 78"/><path d="M14 88 H62"/></svg>`,
  paper: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><rect x="14" y="16" width="72" height="68" rx="4"/><path d="M26 32 H74 M26 46 H50 M26 58 H50 M26 70 H50"/><rect x="56" y="46" width="18" height="24"/></svg>`,
  coin: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><circle cx="50" cy="50" r="32"/><path d="M50 32 V68 M40 40 Q50 32 60 40 Q50 50 40 58 Q50 68 60 60" stroke-linecap="round"/></svg>`,
  bank: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><path d="M12 36 L50 14 L88 36 Z"/><path d="M22 42 V74 M40 42 V74 M60 42 V74 M78 42 V74"/><path d="M12 84 H88"/></svg>`,
  wallet: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><rect x="12" y="28" width="76" height="54" rx="8"/><path d="M20 28 L66 14 L72 28"/><rect x="62" y="46" width="26" height="18" rx="4"/></svg>`,
  lock: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"><rect x="22" y="44" width="56" height="42" rx="6"/><path d="M34 44 V32 Q34 16 50 16 Q66 16 66 32 V44"/></svg>`,
  contract: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><path d="M24 12 H64 L80 28 V88 H24 Z"/><path d="M64 12 V28 H80"/><path d="M34 44 H70 M34 56 H70 M34 68 H56"/></svg>`,
  clock: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><circle cx="50" cy="50" r="34"/><path d="M50 30 V50 L64 60"/></svg>`,
  hand: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M30 54 V30 Q30 24 36 24 Q42 24 42 30 V50 M42 46 V22 Q42 16 48 16 Q54 16 54 22 V48 M54 46 V26 Q54 20 60 20 Q66 20 66 26 V52 M66 50 V38 Q66 32 72 32 Q78 32 78 38 V62 Q78 84 56 86 Q38 88 28 72 L18 58 Q16 52 22 50 Q26 49 30 54"/></svg>`,
  chain: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><rect x="10" y="38" width="44" height="24" rx="12"/><rect x="46" y="38" width="44" height="24" rx="12"/></svg>`,
  check: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M18 52 L40 74 L82 28"/></svg>`,
  cross: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"><path d="M24 24 L76 76 M76 24 L24 76"/></svg>`,
  mark: `<svg viewBox="0 0 120 120"><path fill="currentColor" d="M14.03 10 H60.36 A48.16 43.95 0 0 1 108.52 53.95 H79.46 A24.01 24.99 0 0 0 55.45 28.95 H37.47 V91.15 H55.17 A24.29 25.27 0 0 0 79.46 65.88 H108.52 A49.56 44.09 0 0 1 58.96 109.97 H14.03 Q11.5 109.97 11.5 107.44 V12.53 Q11.5 10 14.03 10 Z"/></svg>`,
}
const icon = (name, size, color, x, y, id = '') => add(`<div ${id ? `id="${id}"` : ''} class="abs" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;color:${color}">${I[name]}</div>`)

// ── scenes ────────────────────────────────────────────────────────────────
const scenes = {
  // Scene 1a: the measured gap, with the real Q3 histogram
  intro() {
    S.bg = add(`<div class="abs" style="left:900px;top:100px;width:1100px;height:707px;opacity:0;background:url(../real/gz-petitions-list.png) center/cover;filter:grayscale(.3)"></div>`)
    S.bgc = add(`<p class="credit" style="right:40px;top:40px">background: thegazette.co.uk insolvency notices, 28 Oct 2026 (OGL)</p>`)
    add(`<div class="rule"></div>`)
    S.k = add(`<p class="abs k" style="left:160px;top:124px">The gap, measured · Q3 2026</p>`)
    S.n = add(`<div class="abs big" style="left:160px;top:190px;font-size:150px">0</div>`)
    S.nl = add(`<p class="abs cap" style="left:164px;top:350px;width:640px">winding-up petitions in The Gazette, Q3 2026 (with a presentation date)</p>`)
    S.pct = add(`<div class="abs big" style="left:1180px;top:170px;font-size:300px;color:var(--seal)">0%</div>`)
    S.pl = add(`<p class="abs cap" style="left:1188px;top:450px;width:600px">became public only after a <b>14-day</b> loan grace window had closed</p>`)
    const W = 1600, H = 300, x0 = 160, y0 = 860, bins = DATA.bins, max = Math.max(...bins), bw = W / bins.length
    let svg = `<svg class="abs" style="left:0;top:0" width="1920" height="1080">`
    svg += `<rect id="shade" x="${x0 + bw * 14 / 5}" y="${y0 - H - 20}" width="0" height="${H + 20}" fill="var(--seal-wash)"/>`
    bins.forEach((b, i) => { svg += `<rect class="bar" data-h="${(b / max) * H}" x="${x0 + i * bw + 4}" y="${y0}" width="${bw - 8}" height="0" rx="4" fill="${i * 5 + 5 <= 14 ? 'var(--ink-3)' : 'var(--seal)'}"/>` })
    svg += `<line x1="${x0}" y1="${y0}" x2="${x0 + W}" y2="${y0}" stroke="var(--ink)" stroke-width="2"/>`
    ;[0, 14, 36, 70].forEach((d) => { svg += `<text class="tick" x="${x0 + bw * d / 5}" y="${y0 + 36}" font-size="24" fill="var(--ink-2)" text-anchor="middle">${d === 70 ? '70+ days' : d === 0 ? 'day 0' : d}</text>` })
    svg += `<text id="axis" x="${x0}" y="${y0 - H - 50}" font-size="24" fill="var(--ink-3)">days from presentation to advertisement</text>`
    svg += `<line id="l14" x1="${x0 + bw * 14 / 5}" x2="${x0 + bw * 14 / 5}" y1="${y0 - H - 30}" y2="${y0 - H - 30}" stroke="var(--seal)" stroke-width="4" stroke-dasharray="10 8"/>`
    svg += `<text id="l14t" x="${x0 + bw * 14 / 5 + 14}" y="${y0 - H - 4}" font-size="26" fill="var(--seal)">day 14: grace window closes</text>`
    svg += `<text id="med" x="${x0 + bw * 36 / 5}" y="${y0 - H - 4}" font-size="26" fill="var(--ink)" text-anchor="middle">median: day 36</text>`
    svg += `</svg>`
    S.svg = add(svg)
    S.bars = [...document.querySelectorAll('.bar')]
  },
  intro_seek(t) {
    S.bg.style.opacity = .07 * p(t, 0, 1.2); S.bg.style.transform = `scale(${1.04 - .04 * clamp(t / 12)})`; S.bgc.style.opacity = .9 * p(t, .5, 1)
    show(S.k, p(t, 0, .5))
    S.n.textContent = fmt(1594 * out(p(t, .1, 1.3))); show(S.n, p(t, 0, .4)); show(S.nl, p(t, .4, .6))
    const a = cue('ninety', 1.3)
    S.pct.textContent = Math.round(94 * out(p(t, a - .2, 1.2))) + '%'; pop(S.pct, p(t, a - .3, .7)); show(S.pl, p(t, a + .6, .6))
    const b = cue('public', 5.8)
    S.bars.forEach((r, i) => { const k = out(p(t, b + i * .08, .7)); const hh = +r.dataset.h * k; r.setAttribute('height', hh); r.setAttribute('y', 860 - hh) })
    document.querySelectorAll('.tick,#axis').forEach((e) => (e.style.opacity = p(t, b, .6)))
    const c = cue('fourteen', 8.3), line = $('#l14')
    line.setAttribute('y2', 530 + 330 * out(p(t, c - .2, .5)))
    $('#l14t').style.opacity = p(t, c + .2, .4)
    $('#shade').setAttribute('width', (1600 - 1600 / 15 * 14 / 5) * ease(p(t, c + .3, 1.2)))
    $('#med').style.opacity = p(t, b + 1.6, .5)
  },

  // Scene 1b: pre-registered October check
  holdout() {
    add(`<div class="rule"></div>`)
    S.k = add(`<p class="abs k" style="left:160px;top:124px">Predicted on 17 October · tested on October data</p>`)
    S.big = add(`<div class="abs big" style="left:160px;top:200px;font-size:260px;color:var(--seal)">5/5</div>`)
    S.sub = add(`<p class="abs cap" style="left:170px;top:470px;width:560px">predictions held on 409 petitions advertised 1–16 October</p>`)
    const rows = [['Median days', '33 – 39', '38'], ['After 14 days', '≥ 90%', '95.4%'], ['After 30 days', '72 – 86%', '77.5%'], ['After 60 days', '≤ 15%', '5.1%'], ['Middle half', '27 – 45', '34 – 42']]
    S.rows = rows.map((r, i) => add(`<div class="abs" style="left:840px;top:${230 + i * 128}px;width:920px;display:grid;grid-template-columns:360px 220px 200px 1fr;align-items:center;font-size:38px;border-bottom:1px solid var(--paper-3);padding-bottom:20px">
      <span>${r[0]}</span><span class="mono" style="font-size:30px;color:var(--ink-3)">${r[1]}</span><span class="mono" style="font-size:34px">${r[2]}</span><span style="width:56px;height:56px;color:var(--green)">${I.check}</span></div>`))
  },
  holdout_seek(t) {
    show(S.k, p(t, 0, .4))
    S.rows.forEach((r, i) => { show(r, p(t, .2 + i * .45, .4)); pop(r.lastElementChild, p(t, .45 + i * .45, .4)) })
    pop(S.big, p(t, .4 + 5 * .45, .5)); show(S.sub, p(t, .6 + 5 * .45, .5))
  },

  // Scene 1c: the name
  title() {
    S.mark = icon('mark', 230, 'var(--seal)', 520, 300)
    S.word = add(`<div class="abs big" style="left:790px;top:300px;font-size:230px">Drawstop</div>`)
    S.sub = add(`<p class="abs cap" style="left:800px;top:560px;font-size:40px">a Chainlink CRE workflow for tokenized loans</p>`)
    S.flow = add(`<div class="abs" style="left:420px;top:720px;width:1080px;height:200px"></div>`)
    const items = [['paper', 'public notice'], ['chain', 'Chainlink CRE'], ['contract', 'loan contract']]
    S.items = items.map(([ic, lab], i) => add(`<div class="abs" style="left:${470 + i * 400}px;top:740px;width:220px;text-align:center"><div style="width:110px;height:110px;margin:0 auto;color:${i === 1 ? 'var(--seal)' : 'var(--ink)'}">${I[ic]}</div><p class="mono" style="font-size:22px;color:var(--ink-2);margin-top:10px">${lab}</p></div>`))
    S.arrows = [0, 1].map((i) => add(`<div class="abs" style="left:${700 + i * 400}px;top:790px;height:4px;background:var(--ink);width:0"></div>`))
    S.coin = icon('coin', 70, 'var(--ochre)', 1550, 760)
    S.bar = add(`<div class="abs" style="left:1520px;top:735px;width:10px;height:130px;background:var(--seal);border-radius:4px"></div>`)
  },
  title_seek(t) {
    const k = p(t, .1, .8); S.mark.style.opacity = k; S.mark.style.transform = `scale(${.7 + .3 * back(k)}) rotate(${(1 - out(k)) * -12}deg)`
    show(S.word, p(t, .4, .8), 30); show(S.sub, p(t, .9, .7))
    const r = cue('react', 4.8)
    S.items.forEach((e, i) => show(e, p(t, r - 1.6 + i * .5, .5)))
    S.arrows.forEach((a, i) => (a.style.width = 170 * ease(p(t, r - 1.3 + i * .5, .5)) + 'px'))
    const m = cue('money', 7.5)
    const ck = ease(p(t, m - .6, .8)); S.coin.style.opacity = p(t, m - .7, .2); S.coin.style.left = (1740 - 190 * ck) + 'px'
    S.bar.style.opacity = p(t, m - .2, .3)
  },

  // Scene 2: the law, as a timeline; then AMS
  law() {
    add(`<div class="rule"></div>`)
    S.k = add(`<p class="abs k" style="left:160px;top:124px">England and Wales · Insolvency Act 1986</p>`)
    const x = (d) => 260 + d * 22, y = 600
    S.x = x
    let svg = `<svg class="abs" style="left:0;top:0" width="1920" height="1080">`
    svg += `<line id="axis2" x1="${x(0)}" y1="${y}" x2="${x(0)}" y2="${y}" stroke="var(--ink)" stroke-width="4"/>`
    svg += `<rect id="risk" x="${x(0)}" y="${y + 14}" width="0" height="26" fill="var(--seal)" opacity=".85"/>`
    svg += `<text id="riskt" x="${x(0)}" y="${y + 80}" font-size="30" fill="var(--seal)">s.127 risk: every payment from day 0</text>`
    svg += `<rect id="hid" x="${x(0)}" y="${y - 62}" width="0" height="52" fill="var(--paper-3)" opacity=".6"/>`
    svg += `<text id="hidt" x="${x(18)}" y="${y - 26}" font-size="30" fill="var(--ink-2)" text-anchor="middle" font-style="italic">not in any free open data</text>`
    svg += `<text id="daysn" x="${x(49)}" y="${y + 150}" font-size="88" fill="var(--seal)" text-anchor="middle"></text>`
    svg += `</svg>`
    add(svg)
    S.gavel = icon('gavel', 120, 'var(--ink)', x(0) - 60, y - 340)
    S.gl = add(`<p class="abs" style="left:${x(0) - 80}px;top:${y - 205}px;width:300px;font-size:30px"><b>Day 0</b> · petition presented<br><span class="mono" style="font-size:20px;color:var(--ink-3)">s.129(2): deemed to start here</span></p>`)
    S.coins = [0, 1, 2].map((i) => icon('coin', 70, 'var(--ochre)', x(8 + i * 8) - 35, y + 110))
    S.void = add(`<div class="abs stamp" style="left:${x(4)}px;top:${y + 200}px;color:var(--seal);transform:rotate(-6deg)">void if an order follows</div>`)
    S.paper = icon('paper', 120, 'var(--ink)', x(36) - 60, y - 340)
    S.pl = add(`<p class="abs" style="left:${x(36) - 40}px;top:${y - 205}px;width:420px;font-size:30px"><b id="pday">Day 36</b> · advertised in The Gazette<br><span class="mono" style="font-size:20px;color:var(--ink-3)" id="pnote">Q3 2026 median</span></p>`)
    S.notice = add(`<div class="shot" style="left:160px;top:615px;width:780px"><img src="../real/gz-petition-text.png"><div style="position:absolute;left:24.5%;top:30%;width:41%;height:13.5%;border:4px solid var(--seal);border-radius:4px;background:rgba(163,39,29,.08)"></div></div>`)
    S.noticec = add(`<p class="credit" style="left:160px;top:866px">The Gazette, notice 5219886 · published 29 Sep 2026</p>`)
    S.ams = add(`<p class="abs" style="left:900px;top:130px;font-size:36px">AMS FACILITIES (SW) LTD · <span class="mono" style="font-size:30px">11 Aug → 29 Sep 2026</span></p>`)
  },
  law_seek(t) {
    const x = S.x, y = 600
    show(S.k, p(t, 0, .5))
    $('#axis2').setAttribute('x2', x(0) + 1300 * ease(p(t, .3, 1.2)))
    const pres = cue('presented', 5.2)
    pop(S.gavel, p(t, cue('risk', 2.2) - .2, .6)); show(S.gl, p(t, pres - .3, .5))
    const rk = p(t, pres, 9); $('#risk').setAttribute('width', 1300 * ease(rk) * (t > cue('AMS', 19) ? 1 : 1)); $('#riskt').style.opacity = p(t, pres + .4, .5)
    const v = cue('void', 9.9)
    S.coins.forEach((c, i) => pop(c, p(t, v - 1.6 + i * .3, .5)))
    const vk = p(t, v - .1, .4); S.void.style.opacity = clamp(vk * 3); S.void.style.transform = `rotate(-6deg) scale(${1.6 - .6 * out(vk)})`
    const g = cue('Gazette', 16.3)
    pop(S.paper, p(t, g - .6, .6)); show(S.pl, p(t, g - .3, .5))
    $('#hid').setAttribute('width', (x(36) - x(0)) * ease(p(t, cue('public', 13.3), 1.2))); $('#hidt').style.opacity = p(t, cue('public', 13.3) + .6, .6)
    const a = cue('AMS', 19.0)
    show(S.ams, p(t, a - .2, .5))
    const fade = 1 - p(t, a - .6, .4); S.coins.forEach((c) => (c.style.opacity = Math.min(+c.style.opacity || 0, fade))); S.void.style.opacity = Math.min(+S.void.style.opacity, fade)
    const nk = p(t, a - .3, .6); S.notice.style.opacity = nk; S.notice.style.transform = `translateY(${-30 * (1 - out(nk))}px)`; S.noticec.style.opacity = p(t, a + .2, .5)
    const mv = ease(p(t, a + .4, 1.2)); const day = 36 + 13 * mv
    S.paper.style.left = (x(day) - 60) + 'px'; S.pl.style.left = (x(day) - 40) + 'px'
    $('#pday').textContent = t > a ? `Day ${Math.round(day)}` : 'Day 36'; $('#pnote').textContent = t > a ? 'AMS: 29 September' : 'Q3 2026 median'
    $('#hid').setAttribute('width', (x(t > a ? day : 36) - x(0)) * ease(p(t, cue('public', 13.3), 1.2)))
    const f = cue('forty', 21.8); const dn = $('#daysn'); dn.setAttribute('x', x(day)); dn.textContent = t > f - .3 ? Math.round(49 * out(p(t, f - .3, .8))) + ' days' : ''
  },

  // Scene 3: bank account freezes, stablecoin wallet does not
  freeze() {
    add(`<div class="rule"></div>`)
    S.k = add(`<p class="abs k" style="left:160px;top:124px">Why it has to be on-chain</p>`)
    S.lh = add(`<p class="abs mono" style="left:240px;top:210px;font-size:26px;letter-spacing:.14em;color:var(--ink-3)">OFF-CHAIN</p>`)
    S.rh = add(`<p class="abs mono" style="left:1060px;top:210px;font-size:26px;letter-spacing:.14em;color:var(--ink-3)">ON-CHAIN</p>`)
    S.bank = icon('bank', 220, 'var(--ink)', 300, 280)
    S.lock = icon('lock', 120, 'var(--seal)', 470, 420)
    S.lt = add(`<p class="abs" style="left:240px;top:560px;width:620px;font-size:38px">A bank that learns of a petition usually <b>freezes the account</b>.</p>`)
    S.ls = add(`<div class="abs stamp" style="left:240px;top:700px;color:var(--seal)">Account frozen</div>`)
    S.wal = icon('wallet', 220, 'var(--ink)', 1120, 280)
    S.coins = [0, 1, 2, 3, 4].map(() => icon('coin', 64, 'var(--ochre)', 1300, 360))
    S.hold = add(`<p class="abs mono" style="left:1600px;top:300px;font-size:22px;color:var(--ink-3)">token holders</p>`)
    S.rt = add(`<p class="abs" style="left:1060px;top:560px;width:640px;font-size:38px">Nobody freezes a borrower's <b>stablecoin wallet</b>.</p>`)
    S.rs = add(`<div class="abs stamp" style="left:1060px;top:700px;color:var(--ochre)">Wallet open</div>`)
    S.div = add(`<div class="abs" style="left:950px;top:210px;width:2px;height:560px;background:var(--paper-3)"></div>`)
    S.bot = add(`<p class="abs" style="left:240px;top:850px;font-size:56px">So the stop has to live <em style="color:var(--seal)">in the loan contract.</em></p>`)
    S.bar = add(`<div class="abs" style="left:1500px;top:330px;width:12px;height:150px;background:var(--seal);border-radius:4px"></div>`)
  },
  freeze_seek(t) {
    show(S.k, p(t, 0, .4)); show(S.lh, p(t, .2, .4)); pop(S.bank, p(t, cue('bank', 1.5) - .4, .6))
    const f = cue('freezes', 4.0); const lk = p(t, f - .3, .5); S.lock.style.opacity = clamp(lk * 3); S.lock.style.transform = `translateY(${-60 * (1 - out(lk))}px)`
    show(S.lt, p(t, cue('bank', 1.5), .6)); pop(S.ls, p(t, f + .3, .5))
    const o = cue('On', 5.1); show(S.rh, p(t, o - .2, .4)); show(S.div, p(t, o - .3, .4), 0); pop(S.wal, p(t, o, .6)); show(S.rt, p(t, o + .4, .6)); pop(S.rs, p(t, cue('wallet', 8.8) - .2, .5)); show(S.hold, p(t, o + 1, .5))
    const stop = cue('stop', 10.2)
    S.coins.forEach((c, i) => {
      const period = 1.6, start = o + .8 + i * period / 5
      let ph = t < start ? -1 : ((t - start) % period) / period
      let xx = 1300 + 360 * ph
      if (t > stop && ph >= 0) xx = Math.min(xx, 1420)
      c.style.opacity = ph < 0 ? 0 : (t > stop ? .9 : Math.sin(Math.PI * ph))
      c.style.left = xx + 'px'; c.style.top = (360 - 40 * Math.sin(Math.PI * Math.max(ph, 0))) + 'px'
    })
    S.bar.style.opacity = p(t, stop - .2, .3); show(S.bot, p(t, cue('So', 10.0) - .2, .6))
  },

  // Scene 4: the workflow, assembled step by step
  arch() {
    add(`<div class="rule"></div>`)
    S.k = add(`<p class="abs k" style="left:160px;top:124px">Chainlink CRE: the orchestration layer</p>`)
    S.cre = add(`<div class="card" style="left:620px;top:200px;width:680px;height:700px;border-color:var(--seal);background:#f6efe2"><p class="t" style="color:var(--seal)">CRE workflow</p></div>`)
    S.tr1 = add(`<div class="card" style="left:120px;top:260px;width:400px"><p class="t">Trigger</p><h3>Cron</h3><p>rotates through monitored companies</p></div>`)
    S.tr2 = add(`<div class="card" style="left:120px;top:560px;width:400px"><p class="t">Trigger</p><h3>Drawdown request</h3><p>EVM log: <span class="mono" style="font-size:20px">DrawdownRequested</span></p></div>`)
    S.src = [['The Gazette', 'petitions, orders, dismissals'], ['Companies House', 'company status'], ['GLEIF', 'LEI cross-check']].map((s, i) =>
      add(`<div class="card" style="left:660px;top:${270 + i * 150}px;width:600px;padding:16px 22px;display:flex;justify-content:space-between;align-items:center"><div><h3 style="font-size:30px">${s[0]}</h3><p style="font-size:22px">${s[1]}</p></div><div class="res" style="width:56px;height:56px;color:var(--green)">${I.check}</div></div>`))
    S.cons = add(`<div class="abs" style="left:660px;top:735px;width:600px;text-align:center;font-size:30px;padding:16px;border-radius:10px;background:var(--ochre-wash);border:2px solid var(--ochre)">identical-value consensus, per source</div>`)
    S.reg = add(`<div class="card" style="left:1400px;top:300px;width:400px"><p class="t">Ethereum Sepolia</p><h3>StatusRegistry</h3><p>signed attestation:<br>found · not found · could not be checked</p></div>`)
    S.fac = add(`<div class="card" style="left:1400px;top:620px;width:400px;border-color:var(--seal)"><p class="t">Ethereum Sepolia</p><h3>LoanFacility</h3><p>drawstop · suspense</p></div>`)
    S.pk = add(`<div class="abs" style="width:26px;height:26px;border-radius:50%;background:var(--seal)"></div>`)
    S.pk2 = add(`<div class="abs" style="width:26px;height:26px;border-radius:50%;background:var(--seal)"></div>`)
    S.fail = add(`<div class="abs stamp" style="left:1400px;top:830px;color:var(--ochre);font-size:20px">GLEIF: could not be checked</div>`)
    S.never = add(`<div class="abs" style="left:1400px;top:885px;font-size:28px;color:var(--ink-2)">never <s style="text-decoration-color:var(--seal);text-decoration-thickness:4px">“clean”</s></div>`)
  },
  arch_seek(t) {
    show(S.k, p(t, 0, .4)); pop(S.cre, p(t, .3, .6))
    show(S.tr1, p(t, cue('schedule', 3.8) - .3, .5), 0); S.tr1.style.transform = `translateX(${-60 * (1 - out(p(t, cue('schedule', 3.8) - .3, .5)))}px)`
    show(S.tr2, p(t, cue('drawdown', 5.4) - .3, .5), 0); S.tr2.style.transform = `translateX(${-60 * (1 - out(p(t, cue('drawdown', 5.4) - .3, .5)))}px)`
    const src = [cue('Gazette', 10.3), cue('Companies', 11.2), cue('GLEIF', 12.5)]
    S.src.forEach((s, i) => { show(s, p(t, src[i] - .4, .5)); s.querySelector('.res').style.opacity = 0 })
    const c = cue('consensus', 16.0)
    show(S.cons, p(t, cue('identical', 14.8) - .3, .5))
    const fails = cue('fails', 22.4)
    S.src.forEach((s, i) => {
      const r = s.querySelector('.res')
      if (i === 2 && t > fails) { r.innerHTML = I.cross; r.style.color = 'var(--ochre)'; s.style.borderColor = 'var(--ochre)'; s.style.opacity = .75 } else { r.innerHTML = I.check; r.style.color = 'var(--green)'; s.style.borderColor = 'var(--ink)' }
      pop(r, p(t, c - .6 + i * .25, .4))
      if (i === 2 && t > fails) pop(r, p(t, fails, .4))
    })
    const w = cue('writes', 17.8)
    show(S.reg, p(t, w - .2, .5)); show(S.fac, p(t, w + 1.0, .5))
    const k1 = ease(p(t, w, .9)); S.pk.style.opacity = t > w && t < w + 1.0 ? 1 : 0; S.pk.style.left = (1270 + 120 * k1) + 'px'; S.pk.style.top = (560 - 160 * k1) + 'px'
    const k2 = ease(p(t, w + .9, .7)); S.pk2.style.opacity = t > w + .9 && t < w + 1.7 ? 1 : 0; S.pk2.style.left = '1590px'; S.pk2.style.top = (470 + 150 * k2) + 'px'
    pop(S.fail, p(t, cue('could', 24.0) - .4, .5)); show(S.never, p(t, cue('never', 25.8) - .2, .5))
    
  },

  // Scene 9: the s.127 statement
  s127() {
    add(`<div class="rule"></div>`)
    S.k = add(`<p class="abs k" style="left:160px;top:124px">s.127 statement · rebuilt from on-chain events</p>`)
    S.h = add(`<p class="abs" style="left:160px;top:190px;font-size:64px">What reached the lender <em style="color:var(--seal)">after presentation</em></p>`)
    S.n = add(`<div class="abs big" style="left:160px;top:330px;font-size:240px;color:var(--seal)">0</div>`)
    S.al = add(`<p class="abs mono" style="left:170px;top:560px;font-size:26px;color:var(--ink-2)">AT LEAST</p>`)
    S.b1 = add(`<div class="abs" style="left:860px;top:380px;height:110px;width:0;background:var(--seal);border-radius:6px 0 0 6px"></div>`)
    S.b2 = add(`<div class="abs" style="left:860px;top:380px;height:110px;width:0;background:#c45a4e;border-radius:0 6px 6px 0"></div>`)
    S.l1 = add(`<p class="abs" style="left:860px;top:505px;width:560px;font-size:28px"><b>5,000</b> released from suspense on the first dismissal, after the second petition was presented</p>`)
    S.l2 = add(`<p class="abs" style="left:1420px;top:505px;width:340px;font-size:28px"><b>3,000</b> paid straight through</p>`)
    S.c3 = add(`<div class="abs big" style="left:160px;top:690px;font-size:120px;color:var(--ink-3)">3,000</div>`)
    S.strike = add(`<div class="abs" style="left:150px;top:745px;height:10px;width:0;background:var(--seal)"></div>`)
    S.c3l = add(`<p class="abs" style="left:520px;top:720px;width:700px;font-size:30px;color:var(--ink-2)">the loan contract's own counter: direct pass-throughs only</p>`)
    S.note = add(`<p class="abs" style="left:160px;top:840px;font-size:40px;font-style:italic">A dismissal clears only its own petition. Whether any payment is void is for the court.</p>`)
  },
  s127_seek(t) {
    show(S.k, p(t, 0, .4)); show(S.h, p(t, .2, .5))
    const e = cue('eight', 4.2)
    S.n.textContent = fmt(8000 * out(p(t, e - .6, 1.2))); show(S.n, p(t, e - .8, .4)); show(S.al, p(t, cue('least', 3.9) - .2, .4))
    S.b1.style.width = 560 * ease(p(t, e - .6, .8)) + 'px'
    S.b2.style.left = (860 + 560 * ease(p(t, e - .6, .8))) + 'px'; S.b2.style.width = 336 * ease(p(t, e + .2, .6)) + 'px'
    show(S.l1, p(t, e + .2, .5)); show(S.l2, p(t, e + .7, .5))
    const th = cue('three', 8.1)
    show(S.c3, p(t, th - .6, .4)); show(S.c3l, p(t, th - .4, .4)); S.strike.style.width = 360 * ease(p(t, th, .4)) + 'px'
    show(S.note, p(t, cue('dismissal', 9.1) - .2, .6))
  },

  // Scene 10: checks, counting up
  checks() {
    add(`<div class="rule"></div>`)
    S.k = add(`<p class="abs k" style="left:160px;top:124px">Is it right? · checks anyone can rerun</p>`)
    const tiles = [['3 / 3', 'contracts match the source', 'Sourcify: creation + runtime bytecode'], ['128,000', 'random calls', 'invariant fuzzing, 5 properties after every call'], ['5 / 5', 'planted bugs caught', 'the first suite missed 2 of the first 4; fixed'], ['42 + 24', 'unit + workflow tests', 'forge test · bun test, no keys needed']]
    S.src = add(`<div class="shot" style="left:490px;top:222px;width:470px"><img src="../real/sourcify-crop.png"></div>`)
    S.tiles = tiles.map((tl, i) => add(`<div class="abs" style="left:${160 + (i % 2) * 820}px;top:${210 + Math.floor(i / 2) * 380}px;width:760px;border-top:3px solid var(--ink);padding-top:20px">
      <div class="big n" style="font-size:150px;color:${i === 2 ? 'var(--seal)' : 'var(--ink)'}">${tl[0]}</div><p style="font-size:40px;margin-top:10px">${tl[1]}</p><p class="mono" style="font-size:22px;color:var(--ink-3);margin-top:8px">${tl[2]}</p></div>`))
  },
  checks_seek(t) {
    { const k = p(t, cue('Sourcify', 2.2) + .2, .6); S.src.style.opacity = k; S.src.style.transform = `translateY(${20 * (1 - out(k))}px)` }
    show(S.k, p(t, 0, .4))
    const at = [cue('Sourcify', 2.2), cue('hundred', 6.9), cue('caught', 14.1), cue('caught', 14.1) + 1.2]
    S.tiles.forEach((el, i) => show(el, p(t, at[i] - .3, .5)))
    const n = S.tiles[1].querySelector('.n'); n.textContent = fmt(128000 * out(p(t, at[1] - .2, 1.6)))
    const a = S.tiles[0].querySelector('.n'); a.textContent = `${Math.min(3, Math.floor(4 * p(t, at[0], 1.2)))} / 3`
    const b = S.tiles[2].querySelector('.n'); b.textContent = `${Math.min(5, Math.floor(6 * p(t, at[2] - .2, 1.0)))} / 5`
  },

  // Scene 11 end: name, tagline word by word, links
  end() {
    S.mark = icon('mark', 200, 'var(--seal)', 860, 150)
    S.word = add(`<div class="abs big" style="left:0;width:1920px;text-align:center;top:380px;font-size:180px">Drawstop</div>`)
    S.tag = ['English insolvency notices in,', 'loan drawdowns stopped,', 'repayments held.'].map((w, i) => add(`<span class="abs" style="top:600px;font-size:52px;${i ? 'color:var(--seal);font-style:italic' : ''}">${w}</span>`))
    S.links = add(`<div class="abs mono" style="left:0;width:1920px;text-align:center;top:720px;font-size:32px;line-height:1.8">github.com/ZhenYan1214/Drawstop<br>zhenyan1214.github.io/Drawstop · <span style="color:var(--seal)">try to break it: #try</span></div>`)
    S.small = add(`<p class="abs mono" style="left:0;width:1920px;text-align:center;top:880px;font-size:22px;color:var(--ink-3)">Chainlink CRE · Ethereum Sepolia testnet · open source, MIT · not legal advice</p>`)
  },
  end_seek(t) {
    const k = p(t, 0, .8); S.mark.style.opacity = k; S.mark.style.transform = `scale(${.7 + .3 * back(k)})`
    show(S.word, p(t, .3, .7), 30)
    // lay out the tagline centred on one line
    const ws = S.tag.map((e) => e.getBoundingClientRect().width), gap = 18, total = ws.reduce((a, b) => a + b, 0) + gap * 2
    let x = (1920 - total) / 2
    const at = [cue('English', 1.6), cue('loan', 4.0), cue('repayments', 5.7)]
    S.tag.forEach((e, i) => { e.style.left = x + 'px'; x += ws[i] + gap; show(e, p(t, at[i] - .3, .5)) })
    show(S.links, p(t, cue('Everything', 7.4) - .3, .6)); show(S.small, p(t, cue('Everything', 7.4), .6))
  },
}

window.setup = (name, dur, cues, data) => { S = {}; C = cues || {}; D = dur; DATA = data || {}; $('#stage').innerHTML = ''; scenes[name](); window.seek = (t) => scenes[name + '_seek'](t); window.seek(0) }
</script>
</body>
