[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=src/vendor/openzeppelin/"]
# Sepolia (2026) charges ~1,570 gas per deployed byte; optimize for size so deployments fit in one transaction.
optimizer = true
optimizer_runs = 1
via_ir = true
# No CBOR metadata or bytecode hash: ~50 bytes (~80k gas) smaller. Verify on Etherscan with the same settings.
cbor_metadata = false
bytecode_hash = "none"
